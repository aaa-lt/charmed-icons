name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Lint files
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build extension
        run: pnpm build

      - name: Generate icon variants
        run: pnpm generate

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          pnpm pack
          VSIX_PATH="$(ls -1 *.vsix | head -n 1)"
          if [[ -z "${VSIX_PATH}" ]]; then
            echo "No .vsix produced by pnpm pack"
            exit 1
          fi
          echo "vsixPath=${VSIX_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsixPath }}

  github-release:
    name: Publish (GitHub Release Assets)
    runs-on: ubuntu-latest
    needs: build
    environment: github-release
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: .

      - name: Upload VSIX to GitHub Release
        uses: abutler/upload-release-assets@v3.0
        with:
          files: "*.vsix"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  open-vsx:
    name: Publish (Open VSX)
    runs-on: ubuntu-latest
    needs: build
    environment: open-vsx
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: .

      - name: Locate VSIX
        id: locate
        shell: bash
        run: |
          VSIX_PATH="$(ls -1 *.vsix | head -n 1)"
          if [[ -z "${VSIX_PATH}" ]]; then
            echo "No .vsix found"
            exit 1
          fi
          echo "vsixPath=${VSIX_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        continue-on-error: true
        timeout-minutes: 10
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ steps.locate.outputs.vsixPath }}

  zed:
    name: Zed Release
    runs-on: ubuntu-latest
    environment: zed-release
    steps:
      - uses: huacnlee/zed-extension-action@v1
        with:
          extension-name: charmed-nest-icons
          push-to: aaa-lt/extensions
          tag-name: ${{ github.event.release.tag_name }}
        env:
          # Personal access token with "repo" & "workflow" scopes
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
